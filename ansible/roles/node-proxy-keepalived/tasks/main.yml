---
- name: copy conf files
  copy:
    src: files/opt/app/
    dest: /opt/app/
    owner: root
    group: svc
    mode: preserve
    directory_mode: u=rwx,g=rx,o=

- name: install confd files
  include_role:
    name: confd-files

# haproxy
#- name: install haproxy plugins
#  yum:
#    name: ['hatop']
#    update_cache: yes
#    state: present
#  vars:
#    ansible_python_interpreter: /usr/bin/python3

- name: install haproxy
  yum:
    name: "haproxy"
    update_cache: yes
    state: present
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: copy binaries
  copy:
    src: files/lib/
    dest: /lib
    owner: root
    group: root
    mode: preserve
    directory_mode: u=rwx,g=rx,o=

- name: disable auto startup on boot
  systemd:
    name: haproxy
    enabled: no
    masked: yes
    state: stopped

- name: creates directory
  file:
    path: /opt/app/conf/haproxy
    state: directory

# keepalived
- name: Prepare dev env for keepalived
  yum:
    update_cache: yes
    name: ['tree', 'curl', 'gcc', 'make', 'openssl-devel', 'libnl3-devel', 'net-snmp-devel', 'iptables-devel',  'ipset-devel',  'libnfnetlink-devel',  'file-devel', 'glib2-devel',  'json-c-devel']
    state: present
  delegate_to: localhost
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: Prepare directories for keepalived
  file:
    path: /etc/keepalived
    owner: root
    group: root
    state: directory

- name: download keepalived
  include_role:
    name: install
  vars:
    opts:
      pkg_name: keepalived
      pkg_version: "{{ item }}"
      pkg_type: tgz
      pkg_url: "https://www.keepalived.org/software/keepalived-{{ item }}.tar.gz"
      extracts: yes
      creates: "configure"
      bin_path:
  with_items: "{{ keepalived_version }}"

- name: build keepalived
  vars:
    build_path: "/root/.ansible/cache/node-proxy-keepalived/keepalived-{{ keepalived_version }}/build-dir"
  shell: |
    tar -zxvf keepalived-{{ keepalived_version }}.tgz
    cd keepalived-{{ keepalived_version }}/
    ./configure --prefix={{ build_path }}
    make
    sudo make install
  args:
    chdir: "/root/.ansible/cache/node-proxy-keepalived"
    creates: "{{ build_path }}/bin/keepalived"
  delegate_to: localhost

- name: install keepalived bin
  copy:
    src: "{{ item }}"
    dest: /opt/keepalived/{{ keepalived_version }}
    owner: root
    group: root
    mode: preserve
    directory_mode: u=rwx,g=rx,o=
  with_items:
    - "/root/.ansible/cache/node-proxy-keepalived/keepalived-{{ keepalived_version }}/build-dir/"

- name: mask services
  systemd:
    name: keepalived
    enabled: no
    masked: yes
    state: stopped